name: Build & Release GTAR Dev Preview

on:
  push:
    branches: [ dev ]
    tags:
      - 'app-v1.0.*-dev.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-dev:
    name: Build & Release Dev Preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Determine Release Type & Version
        run: python .github/release_metadata.py --platform app --dev-only

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/debug
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk")
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK in $APK_DIR"
            exit 1
          fi
          mkdir -p dev_artifacts
          cp "${APKS[0]}" "dev_artifacts/GTA_${RELEASE_TAG}.apk"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Dev-APK
          path: dev_artifacts/*.apk
          retention-days: 7

      - name: Create GitHub Dev Pre-Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          name: GTAR Dev Preview ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dev_artifacts/GTA_${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
          draft: false
          prerelease: true
          make_latest: false
          body: |
            ### 🧪 GTAR Developer Preview (${{ env.RELEASE_TITLE }})
            - **Application ID:** `com.gtar.app.debug`
            - **Icon:** Distinctive Red DEV adaptive launcher icon
            - **Installation:** Installs side-by-side with production GTAR without overwriting existing data.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
