name: Build & Release GTAR Production

on:
  push:
    tags:
      - 'v*'
      - '!v*-dev*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-prod:
    name: Build & Release Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Decode Release Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > "${{ runner.temp }}/release.jks"
            echo "Release keystore decoded successfully."
          else
            echo "SIGNING_KEY secret not found. Using fallback debug signature."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Production Release APK
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            TAG_FROM_GRADLE=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
            if [[ ! "$TAG_FROM_GRADLE" =~ ^v ]]; then
              VERSION="v${TAG_FROM_GRADLE}"
            else
              VERSION="${TAG_FROM_GRADLE}"
            fi
          fi
          echo "PROD_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Packaging production release APK as GTA_${VERSION}.apk"
          mkdir -p release_artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_artifacts/GTA_${VERSION}.apk"
          else
            echo "Error: app-release.apk not found!" && exit 1
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Prod-APK
          path: release_artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev')
        uses: softprops/action-gh-release@v2
        with:
          name: GTAR Release ${{ env.PROD_VERSION }}
          tag_name: ${{ env.PROD_VERSION }}
          files: release_artifacts/GTA_${{ env.PROD_VERSION }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
