name: Build & Release GTAR

on:
  push:
    tags:
      - 'app-v1.1.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Determine Release Type & Version
        run: python .github/release_metadata.py --platform app

      - name: Validate and decode production signing credentials
        if: env.IS_PRERELEASE != 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Required signing secret $name is missing"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
          else
            ./gradlew testReleaseUnitTest --no-daemon --stacktrace
          fi

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Release Artifacts
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/debug
          if [ "$IS_PRERELEASE" != "true" ]; then APK_DIR=app/build/outputs/apk/release; fi
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk")
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK in $APK_DIR"
            exit 1
          fi
          mkdir -p release_artifacts
          cp "${APKS[0]}" "release_artifacts/GTA_${RELEASE_TAG}.apk"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IS_PRERELEASE == 'true' && 'GTA-Dev-APK' || 'GTA-Prod-APK' }}
          path: release_artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Pre-Release (Dev Builds)
        if: env.IS_PRERELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: GTAR Dev Preview ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release_artifacts/GTA_${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
          draft: false
          prerelease: true
          make_latest: false
          body: |
            ### 🧪 GTAR Developer Preview (${{ env.RELEASE_TITLE }})
            - **Application ID:** `com.gtar.app.debug`
            - **Icon:** Distinctive Red DEV adaptive launcher icon
            - **Installation:** Installs side-by-side with production GTAR without overwriting existing data.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (Production Builds)
        if: env.IS_PRERELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: GTAR Release ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release_artifacts/GTA_${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
