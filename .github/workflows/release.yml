name: Build & Release GTAR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Determine Release Type & Version
        id: release_info
        run: |
          REF="${{ github.ref_name }}"
          BASE_VER=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          DEV_SUFFIX=$(grep 'versionNameSuffix = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          
          if [[ "$REF" == *-dev* ]]; then
            IS_PRE="true"
            VERSION="$REF"
          elif [[ -n "$REF" && "$REF" == v* ]]; then
            IS_PRE="false"
            VERSION="$REF"
          elif [[ -n "$DEV_SUFFIX" ]]; then
            IS_PRE="true"
            VERSION="${BASE_VER}${DEV_SUFFIX}"
          else
            IS_PRE="false"
            VERSION="${BASE_VER}"
          fi
          
          echo "IS_PRERELEASE=${IS_PRE}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Release Version: ${VERSION}, Prerelease: ${IS_PRE}"

      - name: Run Unit Tests
        run: |
          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
          else
            ./gradlew testReleaseUnitTest --no-daemon --stacktrace
          fi

      - name: Decode Release Keystore (Production Only)
        if: env.IS_PRERELEASE != 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > "${{ runner.temp }}/release.jks"
            echo "Release keystore decoded successfully."
          else
            echo "SIGNING_KEY secret not found. Using fallback debug signature."
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Release Artifacts
        run: |
          VERSION="${{ env.RELEASE_VERSION }}"
          mkdir -p release_artifacts
          
          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            if [ -f "app/build/outputs/apk/debug/GTA_${VERSION}.apk" ]; then
              cp "app/build/outputs/apk/debug/GTA_${VERSION}.apk" "release_artifacts/GTA_${VERSION}.apk"
            elif [ -f "app/build/outputs/apk/debug/GTA_v1.0.50-dev.4.apk" ]; then
              cp "app/build/outputs/apk/debug/GTA_v1.0.50-dev.4.apk" "release_artifacts/GTA_${VERSION}.apk"
            else
              FOUND_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
              if [ -n "$FOUND_APK" ]; then
                cp "$FOUND_APK" "release_artifacts/GTA_${VERSION}.apk"
              else
                echo "Error: No debug APK found!" && exit 1
              fi
            fi
          else
            if [ -f "app/build/outputs/apk/release/GTA_${VERSION}.apk" ]; then
              cp "app/build/outputs/apk/release/GTA_${VERSION}.apk" "release_artifacts/GTA_${VERSION}.apk"
            elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              cp "app/build/outputs/apk/release/app-release.apk" "release_artifacts/GTA_${VERSION}.apk"
            else
              FOUND_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
              if [ -n "$FOUND_APK" ]; then
                cp "$FOUND_APK" "release_artifacts/GTA_${VERSION}.apk"
              else
                echo "Error: No release APK found!" && exit 1
              fi
            fi
          fi
          echo "Ready artifact: $(ls -l release_artifacts/)"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IS_PRERELEASE == 'true' && 'GTA-Dev-APK' || 'GTA-Prod-APK' }}
          path: release_artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Pre-Release (Dev Builds)
        if: env.IS_PRERELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: GTAR Dev Preview ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          files: release_artifacts/GTA_${{ env.RELEASE_VERSION }}.apk
          generate_release_notes: true
          draft: false
          prerelease: true
          make_latest: false
          body: |
            ### 🧪 GTAR Developer Preview (${{ env.RELEASE_VERSION }})
            - **Application ID:** `com.gtar.app.debug`
            - **Icon:** Distinctive Red DEV adaptive launcher icon
            - **Installation:** Installs side-by-side with production GTAR without overwriting existing data.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (Production Builds)
        if: env.IS_PRERELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: GTAR Release ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          files: release_artifacts/GTA_${{ env.RELEASE_VERSION }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
